services:
  mariadb:
    build: services/mariadb
    container_name: mariadb
    environment:
      - DB_ADMIN_USERNAME=${DB_ADMIN_USERNAME}
      - DB_ADMIN_HOST=${DB_ADMIN_HOST}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    expose:
      - 3306
    networks:
      - inception
    restart: always
    volumes:
      - mariadb_volume:/var/lib/mysql
  wordpress:
    build: services/wordpress
    container_name: wordpress
    depends_on:
      - mariadb
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - WP_ADMIN_USERNAME=${WP_ADMIN_USERNAME}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    expose:
      - 9000
    networks:
      - inception
    restart: always
    volumes:
      - wordpress_volume:/var/www/html
  nginx:
    build: services/nginx
    container_name: nginx
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - 443:443
    restart: always
    volumes:
      - wordpress_volume:/var/www/html

volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      device: ${MARIADB_VOLUME:-/home/aautin/data/mysql}
      o: bind
      type: none
  wordpress_volume:
    driver: local
    driver_opts:
      device: ${WORDPRESS_VOLUME:-/home/aautin/data/wordpress}
      o: bind
      type: none

networks:
  inception:
