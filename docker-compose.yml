services:
  db:
    image: docker.io/library/mysql:8.0
    restart: unless-stopped
    env_file: .env
    networks:
      - cloud_1
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
  
  wordpress:
    build:
      context: ./services/wordpress
    restart: unless-stopped
    env_file: .env
    networks:
      - cloud_1
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
  
  nginx:
    image: docker.io/library/nginx:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - cloud_1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      wordpress:
        condition: service_healthy

  phpMyAdmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
    networks:
      - cloud_1
    depends_on:
      db:
        condition: service_healthy
    
networks:
  cloud_1:

volumes:
  db_data:
  wordpress_data:
