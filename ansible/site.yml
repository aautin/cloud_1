---
- name: Configure the EC2 host and deploy cloud_1
  hosts: cloud
  become: true
  vars_files:
    - group_vars/all.yml
  vars:
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
    docker_arch: "{{ docker_arch_map.get(ansible_architecture, ansible_architecture) }}"

  tasks:
    - name: Install Docker repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Docker repository signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable Docker at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add SSH user to the Docker group
      ansible.builtin.user:
        name: "{{ ansible_user | default('ubuntu') }}"
        groups: docker
        append: true

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ mysql_volume_dir }}"
        - "{{ wordpress_volume_dir }}"

    - name: Copy Docker Compose project
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Copy application services
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../services/"
        dest: "{{ app_dir }}/services/"
        owner: root
        group: root
        mode: preserve

    - name: Render application environment
      ansible.builtin.template:
        src: app.env.j2
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Start the application
      ansible.builtin.command:
        cmd: docker compose --env-file .env up --build --detach
        chdir: "{{ app_dir }}"
      register: compose_result
      changed_when: >-
        'Started' in compose_result.stdout or
        'Created' in compose_result.stdout or
        'Recreated' in compose_result.stdout