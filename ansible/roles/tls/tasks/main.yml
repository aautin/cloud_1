---
- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ app_dir }}/services/nginx/certs"
    state: directory
    mode: "0755"

- name: Ensure self-signed TLS certificate exists
  ansible.builtin.shell:
    cmd: >-
      if [ ! -f {{ (app_dir ~ '/services/nginx/certs/server.crt') | quote }} ] ||
         [ ! -f {{ (app_dir ~ '/services/nginx/certs/server.key') | quote }} ]; then
        umask 077 && timeout 60s openssl req -x509 -nodes -batch -days 365 -newkey rsa:2048 -keyout {{ (app_dir ~ '/services/nginx/certs/server.key') | quote }} -out {{ (app_dir ~ '/services/nginx/certs/server.crt') | quote }} -subj {{ ('/CN=' ~ app_domain) | quote }} && printf generated;
      else
        printf present;
      fi
  register: tls_generation
  changed_when: tls_generation.stdout == "generated"
